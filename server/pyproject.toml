[project]
name = "assist"
version = "0.1.0"
description = "Tier 2 dev stand-in: inline completion, grammar polish and assistance telemetry (DSPy + FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dspy>=3.4,<4",
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "regex>=2026.9",
    "json-repair>=0.63",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
