schema: spec-driven

context: |
  Project: SpellCheckingPrototype — a standalone prototype of the Bright Pattern
  Agent Desktop "composer assistance layer". It answers two Product Enhancement
  Requests from tenant 2P / GOSI (found in 5.35):
    - PER #60254 Auto Correct: auto-fix clear spelling slips while typing, suggest
      when not confident; spelling first, grammar secondary; Arabic + English;
      admin-enforceable (global on/off), agents use the suggestions.
    - PER #60145 Auto Complete: Gmail Smart Compose-style inline ghost text in the
      same chat/email editor (no popup); generic first, ideally grounded in the
      live conversation, knowledge base and canned responses; admin-enforceable
      globally / per team / per user; agent accepts or ignores each suggestion.
  Source documents (read the .txt extracts, PDFs are the originals):
    docs/requirements/60254-auto-correct.txt
    docs/requirements/60145-auto-complete.txt
    docs/architecture/composer-assistance-architecture.txt  (Sept 15, 2026 draft)

  Hard constraints:
    - Customer InfoSec forbids browser extensions: everything is native page code.
    - Tier 1 (per keystroke) runs fully in the browser with NO network calls:
      composer integration, tokenizer + exclusion rules, Hunspell spelling engine
      (WASM in a Web Worker), auto-correct confidence layer.
    - Tier 2 (model-driven: inline completion, grammar polish) is server-side and
      only invoked on typing pause or explicit action. In scope from Phase 3: a dev
      Node server (server/) stands in for the Intelligence Engine; the hosted model
      key (GEMINI_API_KEY) lives only in the server environment, never in the
      browser or the repo. Hosted-model traffic is for synthetic demo data only.
    - Never write decorations into the editable DOM: underlines via the CSS Custom
      Highlight API, ghost text in an overlay/decoration layer. Text changes
      (accepted suggestions, auto-replacements) go through one transaction path so
      a single undo reverts them.
    - Managed fields set spellcheck="false" once our engine is ready.
    - Licensing: no GPL/LGPL terms may be taken. Hunspell (engine) and the
      AyaSpell Arabic dictionary are both tri-licensed GPL/LGPL/MPL and are used
      under the MPL 1.1 option; Hunspell is compiled to WASM by our own build
      (emsdk in Docker), AyaSpell is vendored unmodified in dicts/ar/. English
      dictionary: SCOWL-derived (dictionary-en, MIT AND BSD).
    - English is the first language (delivery priority): every test and every
      spec scenario must work in English, and English is never left without
      coverage for a text behavior.
    - Arabic is first-class: RTL and mixed Arabic/English (bidi) text, per-token
      script detection, Arabic normalization (diacritics, tatweel, alef variants).
    - Exclusions: URLs, emails, case/reference numbers, tokens with digits, and
      Bright Pattern substitution fields like $(user.firstName) are never checked.

  Delivery phases (from the architecture doc):
    1. Spell check EN + AR, suggest-only.          (#60254)
    2. Auto-replace via confidence layer, custom dictionary, mode enforcement. (#60254)
    3. Inline completion from transcript + canned responses, telemetry. (#60145)
    4. KB grounding for completion, on-demand grammar polish. (#60145 + #60254)

  Tech stack: TypeScript (strict), Vite (dev server + build, ES-module workers),
  Vitest (jsdom for DOM tests), npm (not pnpm/yarn), Node 25. Hunspell → WASM via
  Docker image emscripten/emsdk (pinned tag). Vanilla DOM, no UI framework — the
  real Agent Desktop editor is not available, so a demo page provides a chat
  composer and a rich-text (contenteditable) email composer as stand-ins.

  Known risks to keep visible: RTL ghost-text positioning; auto-correct on Enter
  in chat sends before the agent sees the change; Hunspell weakness on Arabic
  clitics/affixes; completion latency budget (200–400 ms).

rules:
  proposal:
    - State which PER(s) and which delivery phase the change serves (or "infrastructure").
    - Include a Non-goals section.
    - Call out any new third-party dependency with its license.
  specs:
    - Whenever text is processed, write scenarios for English first, then Arabic and mixed Arabic/English input.
    - Tier 1 requirements must state that they work without network access.
  design:
    - Say which tier (1 browser / 2 server / config) each component lives in.
    - Note any interaction with undo, the editable DOM, or RTL layout.
  tasks:
    - Every behavior task has a matching test task (Vitest), or an explicit manual check on the demo page when it cannot be automated.
    - Keep tasks small enough to finish and verify in one sitting.
