<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer assistance demo</title>
  </head>
  <body>
    <header>
      <h1>Composer assistance demo</h1>
      <div id="model-banner" class="banner" role="status" aria-live="polite">Checking the completion and polish model…</div>
      <div id="browser-notice" class="banner warn" role="alert" hidden></div>
      <p id="engine-status" class="status" role="status" aria-live="polite">Spelling engine: loading…</p>
      <div class="settings">
        <label><input type="checkbox" id="fidelity-toggle" /> Agent Desktop fidelity (chat: fixed LTR)</label>
      </div>
      <form id="assist-settings" class="panel assist-settings" aria-label="Assistance settings">
        <div class="presets" role="group" aria-label="Presets">
          <span>Presets:</span>
          <button type="button" data-preset="spell">Spell check only</button>
          <button type="button" data-preset="autocorrect">Auto-correct</button>
          <button type="button" data-preset="all">Everything on</button>
          <button type="button" data-reset>Reset demo settings</button>
        </div>
        <fieldset>
          <legend>Admin policy <small>(stand-in for Contact Center Administrator)</small></legend>
          <label>Mode
            <select name="mode">
              <option value="off">Off</option>
              <option value="suggest">Suggest only</option>
              <option value="auto">Auto-replace and suggest</option>
            </select>
          </label>
          <label>Auto-replace confidence
            <select name="autoReplace">
              <option value="list-and-rule">Misspellings list and single-candidate rule</option>
              <option value="list">Misspellings list only</option>
            </select>
          </label>
          <span class="langs">Languages
            <label><input type="checkbox" name="lang" value="en" /> English</label>
            <label><input type="checkbox" name="lang" value="ar" /> Arabic</label>
          </span>
          <label><input type="checkbox" name="agentMayLower" /> Agents may choose a less aggressive mode</label>
          <label class="dict">Custom dictionary <small>(one word per line)</small>
            <textarea name="customDictionary" rows="3" dir="auto" spellcheck="false"></textarea>
          </label>
          <label>Inline completion
            <select name="completionEnabled">
              <option value="off">Off</option>
              <option value="all">Everyone</option>
              <option value="listed">Listed teams and users</option>
            </select>
          </label>
          <label>Teams <small>(comma-separated)</small> <input name="completionTeams" placeholder="Pensions, Registration" /></label>
          <label>Users <small>(comma-separated)</small> <input name="completionUsers" placeholder="agent.42" /></label>
          <span class="langs">Completion context
            <label><input type="checkbox" name="sourceTranscript" /> Conversation</label>
            <label><input type="checkbox" name="sourceCanned" /> Canned responses</label>
            <label><input type="checkbox" name="sourceKb" /> Knowledge base</label>
          </span>
          <label>Grammar polish
            <select name="grammarEnabled">
              <option value="off">Off</option>
              <option value="all">Everyone</option>
              <option value="listed">Listed teams and users</option>
            </select>
          </label>
          <label>Polish teams <small>(comma-separated)</small> <input name="grammarTeams" /></label>
          <label>Polish users <small>(comma-separated)</small> <input name="grammarUsers" /></label>
        </fieldset>
        <fieldset>
          <legend>Agent</legend>
          <label>Current user <input name="agentUser" /></label>
          <label>Current team <input name="agentTeam" /></label>
          <label>My preference
            <select name="agentMode">
              <option value="">Use admin setting</option>
              <option value="off">Off</option>
              <option value="suggest">Suggest only</option>
              <option value="auto">Auto-replace and suggest</option>
            </select>
          </label>
          <label><input type="checkbox" name="agentCompletion" /> Use inline completion</label>
          <label><input type="checkbox" name="agentGrammar" /> Use grammar polish</label>
          <output name="effective" aria-live="polite"></output>
        </fieldset>
        <div class="actions">
          <button type="submit">Apply</button>
          <span id="assist-events" class="events" aria-live="polite"></span>
          <a href="/api/summary" target="_blank" rel="noopener">Telemetry summary</a>
        </div>
      </form>
    </header>
    <main>
      <section class="panel" aria-labelledby="chat-title">
        <h2 id="chat-title">Chat</h2>
        <div class="customer-controls" aria-label="Customer simulation">
          <select id="scenario" aria-label="Customer scenario">
            <option value="en-pension">Scenario: pension inquiry (English)</option>
            <option value="ar-pension">Scenario: pension inquiry (Arabic)</option>
          </select>
          <button type="button" id="next-customer">Next customer message</button>
          <form id="customer-says"><input name="text" dir="auto" placeholder="Customer says…" aria-label="Customer says" /><button type="submit">Send as customer</button></form>
        </div>
        <ol id="chat-transcript" class="transcript" aria-label="Chat transcript"></ol>
        <div id="chat-composer" class="composer chat" contenteditable="true" dir="auto" role="textbox"
             aria-multiline="true" aria-label="Chat message" data-placeholder="Type a message — Enter sends, Shift+Enter for a new line"></div>
        <div class="toolbar chat-controls" role="toolbar" aria-label="Chat controls">
          <button type="button" data-insert="😊" aria-label="Insert Emoji">😊</button>
          <button type="button" data-insert="Thank you for contacting GOSI. How can I help you today?" aria-label="Insert predefined message (English)">Predefined (EN)</button>
          <button type="button" data-insert="شكراً لتواصلك مع التأمينات الاجتماعية. كيف يمكنني مساعدتك؟" aria-label="Insert predefined message (Arabic)">Predefined (AR)</button>
        </div>
      </section>
      <section class="panel" aria-labelledby="email-title">
        <h2 id="email-title">Email</h2>
        <div class="toolbar email-toolbar" role="toolbar" aria-label="Formatting">
          <button type="button" data-command="bold" aria-label="Bold"><b>B</b></button>
          <button type="button" data-command="italic" aria-label="Italic"><i>I</i></button>
          <button type="button" data-command="insertUnorderedList" aria-label="Bulleted list">• List</button>
          <button type="button" data-command="insertOrderedList" aria-label="Numbered list">1. List</button>
        </div>
        <div id="email-composer" class="composer email" contenteditable="true" dir="auto" role="textbox"
             aria-multiline="true" aria-label="Email body"><p><br /></p></div>
      </section>
    </main>
    <footer class="app-footer">Composer assistance prototype <span id="app-version"></span> · synthetic demo data only</footer>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
